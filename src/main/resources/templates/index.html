<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticket Reservation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 40px;
        }
        
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .event-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .event-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
        }
        
        .event-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
        }
        
        .event-header h2 {
            font-size: 1.5em;
            margin-bottom: 5px;
        }
        
        .event-header p {
            opacity: 0.9;
            font-size: 0.95em;
        }
        
        .event-body {
            padding: 20px;
        }
        
        .event-info {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #eee;
        }
        
        .info-item {
            text-align: center;
        }
        
        .info-item label {
            display: block;
            font-size: 0.85em;
            color: #999;
            margin-bottom: 5px;
            text-transform: uppercase;
        }
        
        .info-item strong {
            font-size: 1.3em;
            color: #333;
        }
        
        .booking-form {
            display: none;
        }
        
        .booking-form.active {
            display: block;
        }
        
        .form-section {
            margin-bottom: 20px;
        }
        
        .form-section label {
            display: block;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="tel"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.95em;
            transition: border-color 0.3s ease;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="tel"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .seat-selection {
            margin: 20px 0;
        }
        
        .seat-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
            width: 100%;
            max-width: 100%;
            margin: 10px auto;
            overflow-x: auto;
        }
        
        .seat {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #ddd;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.65em;
            transition: all 0.2s ease;
            background: white;
            color: #333;
            min-height: 32px;
            padding: 2px;
        }
        
        .seat:hover:not(.booked) {
            border-color: #667eea;
            transform: scale(1.05);
        }
        
        .seat.available {
            background: white;
            border-color: #ddd;
        }
        
        .seat.available:hover {
            background: #e8eef7;
            border-color: #667eea;
        }
        
        .seat.available.selected {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        
        .seat.booked {
            background: #f44336;
            color: white;
            border-color: #f44336;
            cursor: not-allowed;
            opacity: 0.6;
        }
        
        .seat-legend {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 15px 0;
            font-size: 0.9em;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .legend-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            border: 2px solid #ddd;
        }
        
        .legend-box.available {
            background: white;
        }
        
        .legend-box.selected {
            background: #4caf50;
            border-color: #4caf50;
        }
        
        .legend-box.booked {
            background: #f44336;
            border-color: #f44336;
        }
        
        .selected-seat-display {
            background: #f5f5f5;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 15px;
            text-align: center;
            font-weight: 600;
            color: #333;
        }
        
        .selected-seat-display.empty {
            color: #999;
            font-style: italic;
        }
        
        .form-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        button {
            flex: 1;
            padding: 13px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s ease;
        }
        
        .btn-book {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-book:hover:not(:disabled) {
            opacity: 0.9;
        }
        
        .btn-book:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-cancel {
            background: #f0f0f0;
            color: #333;
        }
        
        .btn-cancel:hover {
            background: #e0e0e0;
        }
        
        .toggle-btn {
            width: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px;
            margin-top: 15px;
        }
        
        .no-events {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 1.2em;
        }
        
        .sold-out-badge {
            background: #ffebee;
            color: #c62828;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-weight: bold;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2em;
            }
            
            .events-grid {
                grid-template-columns: 1fr;
            }
            
            .seat-grid {
                grid-template-columns: repeat(8, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎫 Ticket Reservation System</h1>
            <p>Book your tickets for upcoming events with your favorite singers</p>
            <div style="margin-top: 20px;">
                <a href="/manage-tickets" style="color: white; text-decoration: none; font-weight: 600; padding: 10px 20px; background: rgba(255,255,255,0.2); border-radius: 6px; display: inline-block; transition: all 0.3s ease;" onmouseover="this.style.background='rgba(255,255,255,0.3)'" onmouseout="this.style.background='rgba(255,255,255,0.2)'">
                    🔍 Manage & Search Tickets
                </a>
            </div>
        </header>
        
        <div class="events-grid">
            <div th:if="${events.isEmpty()}" class="no-events">
                <p>No events available at the moment. Please check back soon!</p>
            </div>
            
            <div th:each="event : ${events}" class="event-card">
                <div class="event-header">
                    <h2 th:text="${event.eventName}">Event Name</h2>
                    <p th:text="${event.location}">Location</p>
                </div>
                
                <div class="event-body">
                    <div class="event-info">
                        <div class="info-item">
                            <label>Total Seats</label>
                            <strong th:text="${event.totalSeats}">100</strong>
                        </div>
                    </div>
                    
                    <div th:if="${event.availableSeats == 0}">
                        <div class="sold-out-badge">❌ SOLD OUT</div>
                    </div>
                    
                    <div th:if="${event.availableSeats > 0}">
                        <button type="button" th:attr="onclick='toggleForm(this, ' + ${event.id} + ')'" class="toggle-btn">
                            📝 Book Ticket
                        </button>
                        
                        <div th:id="'form-' + ${event.id}" class="booking-form">
                            <form th:action="@{/book}" method="post">
                                <input type="hidden" name="eventId" th:value="${event.id}">
                                
                                <div class="form-section">
                                    <label>👤 Full Name</label>
                                    <input type="text" name="customerName" placeholder="Enter your full name" required>
                                </div>
                                
                                <div class="form-section">
                                    <label>📧 Email Address</label>
                                    <input type="email" name="email" placeholder="Enter your email" required>
                                </div>
                                
                                <div class="form-section">
                                    <label>📱 Phone Number</label>
                                    <input type="tel" name="phoneNo" placeholder="Enter 10-digit phone number" 
                                           pattern="[0-9]{10}" title="Please enter 10 digits" required>
                                </div>
                                
                                <div class="form-section">
                                    <label>🎤 Select Singer</label>
                                    <select name="singerId" required>
                                        <option value="">-- Choose a singer --</option>
                                        <option th:each="singer : ${singers}" 
                                                th:value="${singer.id}" 
                                                th:text="${singer.singerName + ' (' + singer.genre + ')'}">
                                            Singer Name (Genre)
                                        </option>
                                    </select>
                                </div>
                                
                                <div class="form-section">
                                    <label>🎯 Select Your Seat</label>
                                    <div class="seat-legend">
                                        <div class="legend-item">
                                            <div class="legend-box available"></div>
                                            <span>Available</span>
                                        </div>
                                        <div class="legend-item">
                                            <div class="legend-box selected"></div>
                                            <span>Selected</span>
                                        </div>
                                        <div class="legend-item">
                                            <div class="legend-box booked"></div>
                                            <span>Booked</span>
                                        </div>
                                    </div>
                                    
                                    <div class="seat-grid" th:id="'seat-grid-' + ${event.id}">
                                        <!-- Seats will be populated by JavaScript -->
                                    </div>
                                    
                                    <div class="selected-seat-display empty" th:id="'seat-display-' + ${event.id}">
                                        Select a singer first, then choose a seat
                                    </div>
                                    
                                    <input type="hidden" name="seatNumber" th:id="'seat-input-' + ${event.id}" value="" required>
                                </div>
                                
                                <div class="form-buttons">
                                    <button type="submit" class="btn-book" th:disabled="${event.availableSeats == 0}">
                                        ✓ Confirm Booking
                                    </button>
                                    <button type="button" class="btn-cancel" th:attr="onclick='toggleForm(this, ' + ${event.id} + ')'">
                                        ✕ Cancel
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        // Store data for each event
        const eventData = {};
        
        // Initialize event data
        document.addEventListener('DOMContentLoaded', function() {
            const events = document.querySelectorAll('.event-card');
            events.forEach((card) => {
                const eventIdInput = card.querySelector('input[name="eventId"]');
                if (eventIdInput) {
                    const eventId = eventIdInput.value;
                    const totalSeatsText = card.querySelector('.info-item strong').textContent.trim();
                    const totalSeats = parseInt(totalSeatsText);
                    
                    eventData[eventId] = {
                        totalSeats: totalSeats,
                        selectedSeat: null,
                        bookedSeats: [],
                        selectedSingerId: null
                    };
                    
                    // Set up singer change listener
                    const singerSelect = card.querySelector('select[name="singerId"]');
                    if (singerSelect) {
                        singerSelect.addEventListener('change', function() {
                            const singerId = this.value;
                            eventData[eventId].selectedSingerId = singerId;
                            if (singerId) {
                                fetchBookedSeatsBySinger(eventId, singerId);
                            } else {
                                eventData[eventId].bookedSeats = [];
                                initializeSeats(eventId);
                            }
                        });
                    }
                }
            });
        });
        
        function fetchBookedSeatsBySinger(eventId, singerId) {
            // Fetch booked seats for this singer
            fetch('/api/events/' + eventId + '/singers/' + singerId + '/booked-seats')
                .then(response => response.json())
                .then(bookedSeats => {
                    eventData[eventId].bookedSeats = bookedSeats;
                    initializeSeats(eventId);
                })
                .catch(error => {
                    console.error('Error fetching booked seats:', error);
                    initializeSeats(eventId);
                });
        }
        
        function initializeSeats(eventId) {
            const seatGrid = document.getElementById('seat-grid-' + eventId);
            if (!seatGrid) return;
            
            const totalSeats = eventData[eventId].totalSeats;
            const bookedSeats = eventData[eventId].bookedSeats;
            seatGrid.innerHTML = '';
            
            for (let i = 1; i <= totalSeats; i++) {
                const seatDiv = document.createElement('div');
                const isBooked = bookedSeats.includes(i);
                
                if (isBooked) {
                    seatDiv.className = 'seat booked';
                } else {
                    seatDiv.className = 'seat available';
                }
                
                seatDiv.textContent = i;
                seatDiv.setAttribute('data-seat', i);
                
                if (!isBooked) {
                    seatDiv.addEventListener('click', function() {
                        selectSeat(eventId, i);
                    });
                }
                
                seatGrid.appendChild(seatDiv);
            }
        }
        
        function selectSeat(eventId, seatNumber) {
            // Check if singer is selected first
            if (!eventData[eventId].selectedSingerId) {
                alert('Please select a singer first!');
                return;
            }
            
            // Remove previous selection
            document.querySelectorAll('#seat-grid-' + eventId + ' .seat.selected').forEach(seat => {
                seat.classList.remove('selected');
            });
            
            // Check if seat is available
            const selectedSeat = document.querySelector('#seat-grid-' + eventId + ' .seat[data-seat="' + seatNumber + '"]');
            if (selectedSeat && !selectedSeat.classList.contains('booked')) {
                selectedSeat.classList.add('selected');
                eventData[eventId].selectedSeat = seatNumber;
                
                // Update display
                const display = document.getElementById('seat-display-' + eventId);
                display.textContent = 'Seat ' + seatNumber + ' selected ✓';
                display.classList.remove('empty');
                
                // Update hidden input
                const seatInput = document.getElementById('seat-input-' + eventId);
                if (seatInput) {
                    seatInput.value = seatNumber;
                }
            }
        }
        
        function toggleForm(button, eventId) {
            const form = document.getElementById('form-' + eventId);
            form.classList.toggle('active');
            button.textContent = form.classList.contains('active') ? '✕ Cancel Booking' : '📝 Book Ticket';
        }
    </script>
</body>
</html>
